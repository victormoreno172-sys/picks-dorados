name: Diagnóstico
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt && python diag.py > resultado.json
      - run: |
          git config user.name bot; git config user.email bot@local
          git checkout --orphan diag-res; git rm -rq --cached . || true
          git add resultado.json; git commit -qm diag; git push -f origin diag-res
