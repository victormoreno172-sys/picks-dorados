name: Diagnóstico
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: datos-x
          restore-keys: datos-
      - run: python diag_ten.py
      - run: |
          git config user.name bot; git config user.email bot@local
          git checkout --orphan diag-res; git rm -rq --cached . || true
          git add resultado.json; git commit -qm diag; git push -f origin diag-res
