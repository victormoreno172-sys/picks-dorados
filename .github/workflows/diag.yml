name: Diagnóstico
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - run: python diag.py
        env:
          FIREBASE_APP: ${{ secrets.FIREBASE_APP }}
          FIREBASE_CUENTA: ${{ secrets.FIREBASE_CUENTA }}
      - run: |
          git config user.name bot; git config user.email bot@local
          git checkout --orphan diag-res; git rm -rq --cached . || true
          git add resultado.json; git commit -qm diag; git push -f origin diag-res
