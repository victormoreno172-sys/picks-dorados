name: Actualizar picks

on:
  push:
    branches: [main]       # se lanza solo cada vez que cambia el código
  schedule:
    - cron: "15 4-22/2 * * *"
    - cron: "15 23 * * *"      # cada 2 horas (hora UTC) y a las 23:15 UTC = 00:15 de Madrid en invierno (apuestas del día)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false  # si llega otra mientras corre, espera en vez de cortarla

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt pillow openpyxl

      # Guarda las jornadas ya descargadas entre ejecuciones (así no se bajan cada vez)
      - name: Recuperar caché de datos
        uses: actions/cache@v4
        with:
          path: cache
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Recuperar el historial de aciertos
        run: |
          mkdir -p historial
          if git fetch -q --depth 1 origin historial; then
            git show FETCH_HEAD:historial.json > historial/historial.json || true
            git show FETCH_HEAD:banca.json > historial/banca.json 2>/dev/null || rm -f historial/banca.json
          fi

      - name: Calcular predicciones y generar la app
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BANCA: ${{ vars.BANCA }}
        run: |
          set -o pipefail
          { echo "caché al empezar: $(du -sh cache 2>/dev/null | cut -f1) en $(find cache -type f 2>/dev/null | wc -l) archivos"; date -u +%H:%M:%S; } > inicio.txt
          python -u diario.py 2>&1 | tee registro.txt
          { cat inicio.txt; date -u +%H:%M:%S; echo "caché al terminar: $(du -sh cache | cut -f1) en $(find cache -type f | wc -l) archivos"; cat registro.txt; } > r2.txt && mv r2.txt registro.txt
          cp registro.txt web/registro.txt

      - name: Guardar el historial de aciertos
        run: |
          cd historial
          [ -s historial.json ] || exit 0
          git init -q -b historial
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historial.json
          if [ -f banca.json ]; then git add banca.json; fi
          git commit -qm "Historial $(date +%d/%m/%Y-%H:%M)"
          for i in 1 2 3; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" historial && exit 0
            sleep 10
          done
          echo "::warning::no se pudo guardar el historial"

      - name: Publicar en la rama gh-pages
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Picks del $(date +%d/%m/%Y)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
