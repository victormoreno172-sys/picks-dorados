name: Actualizar picks

on:
  schedule:
    - cron: "15 6 * * *"   # cada mañana (08:15 en verano, 07:15 en invierno, hora de Madrid)
    - cron: "15 14 * * *"  # repaso por la tarde, por si se publican más partidos
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt pillow

      - name: Calcular predicciones y generar la app
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          # Telegram solo en la ejecución de la mañana (o al lanzarlo a mano)
          ENVIAR_TELEGRAM: ${{ github.event.schedule != '15 14 * * *' }}
        run: python diario.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: publicar
        uses: actions/deploy-pages@v4
