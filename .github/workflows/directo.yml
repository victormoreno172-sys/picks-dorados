name: Directo
# Cada hora arranca un proceso que durante ~58 minutos actualiza los marcadores en directo cada minuto
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # para lanzar la siguiente vuelta al terminar
concurrency:
  group: directo
  cancel-in-progress: true
jobs:
  directo:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth python-dotenv
      # El cron de GitHub se salta a menudo la actualización de cada 2 horas: si la última tiene más de
      # 1 h 50 min y no hay ninguna en marcha, se lanza desde aquí (esta vuelta corre siempre)
      - name: Lanzar la actualización si se ha saltado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ult=$(gh run list --repo "${{ github.repository }}" --workflow actualizar.yml -L 1 --json createdAt -q '.[0].createdAt')
          vivas=$(gh run list --repo "${{ github.repository }}" --workflow actualizar.yml -L 3 --json status -q '[.[]|select(.status!="completed")]|length')
          edad=$(( ( $(date +%s) - $(date -d "${ult:-1970-01-01T00:00:00Z}" +%s) ) / 60 ))
          echo "última actualización hace $edad min · en marcha: $vivas"
          if [ "${vivas:-0}" = "0" ] && [ "$edad" -ge 110 ]; then gh workflow run actualizar.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" && echo "lanzada"; fi
          exit 0
      - env:
          FIREBASE_CUENTA: ${{ secrets.FIREBASE_CUENTA }}
        run: |
          git config user.name "bot"; git config user.email "bot@local"
          python directo.py
      # El cron de GitHub a veces no salta: cada vuelta lanza la siguiente para que el directo no se pare nunca
      - name: Siguiente vuelta
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run directo.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
