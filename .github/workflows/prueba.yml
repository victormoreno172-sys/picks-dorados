name: prueba-vlr
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: |
          python - <<'P'
          import requests, time, re, directo
          url = "/773430/team-liquid-brazil-vs-gentle-mates-gc-game-changers-2026-championship-s-o-paulo-ubqf"
          t = requests.get("https://www.vlr.gg/773430/d" + str(int(time.time()*1000)), headers={**directo.UA, "Accept": "text/html"}, params={"game": "all", "tab": "overview"}, timeout=25).text
          print("::notice::nav " + str(re.findall(r'vm-stats-gamesnav-item[^>]*?data-game-id="(\d+)"', t)) + " bloques " + str(re.findall(r'<div class="vm-stats-game(?:\s[^"]*)?" data-game-id="(\w+)', t)))
          print("::notice::vlr " + str(directo.vlr("Team Liquid Brazil", "Gentle Mates GC", url=url)))
          P
